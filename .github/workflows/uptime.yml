name: uptime

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency: uptime

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - name: Проверка сайтов
        env:
          TELEGRAM_SERVICE_BOT_TOKEN: ${{ secrets.TELEGRAM_SERVICE_BOT_TOKEN }}
          TELEGRAM_SERVICE_CHAT_ID: ${{ secrets.TELEGRAM_SERVICE_CHAT_ID }}
        run: bash check.sh

      - name: Сохранить состояние
        run: |
          git config user.name "uptime-bot"
          git config user.email "uptime-bot@users.noreply.github.com"
          git add status
          git diff --cached --quiet || (git commit -m "status" && git push)
